# ==============================================================================
# Gradle Daemon & JVM Performance Tuning (Optimized for Pi 5 - 16 GB RAM)
# ==============================================================================
# 4 GB Heap + 768 MB Metaspace eliminates Major GC thrashing during KSP, D8/R8 & Compose tasks.
# ParallelGC with 4 threads saturates the 4 Cortex-A76 cores for fast batch builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:ParallelGCThreads=4

# Parallel task execution & build cache
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# ==============================================================================
# Kotlin Compiler & Daemon Optimization
# ==============================================================================
# Modern Kotlin flags (unified daemon sharing Gradle heap)
kotlin.incremental=true
kotlin.code.style=official

# ==============================================================================
# Android Gradle Plugin (AGP) & AndroidX Settings
# ==============================================================================
android.useAndroidX=true
# Kept true if using legacy third-party support-lib dependencies; set false if all dependencies are native AndroidX
android.enableJetifier=true

# Build speed optimizations: generate non-transitive and namespaced resource classes
android.nonTransitiveRClass=true
android.nonFinalResAnnotations=true
android.nonPublicResAnnotations=true

# Retain project default build features
android.defaults.buildfeatures.buildconfig=true

# ==============================================================================
# Code Shrinking & Optimization (R8)
# ==============================================================================
android.enableR8.fullMode=true
compose_compiler.enableR8ProguardProcessing=true

# ==============================================================================
# Jetpack Compose & KSP Settings
# ==============================================================================
compose.enableResourcesReuse=true
ksp.compiler.args=print=project