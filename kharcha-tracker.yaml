      membership check (group_service.is_member), error mapping. Business rules
      live in services.

      Missing service functions return 501 (listed by GET /api/v1/health).


      Endpoints (prefix /api/v1):

      GET    /health

      POST   /auth/signup                         FR-01, FR-03

      POST   /auth/login                          FR-01

      POST   /auth/password-reset/request         FR-04

      POST   /auth/password-reset/confirm         FR-04

      GET    /users/me                            FR-03

      PATCH  /users/me                            FR-03

      POST   /groups                              FR-06   (PRD)

      GET    /groups                              ?sort=default|activity

      GET    /groups/{group_id}

      DELETE /groups/{group_id}                   FR-09

      POST   /groups/{group_id}/invite            FR-07   (PRD)

      POST   /groups/{group_id}/invite/accept     FR-07   (PRD)

      POST   /groups/{group_id}/members           FR-07   add a registered user
      by email

      GET    /groups/{group_id}/members           member summaries (name/email)

      DELETE /groups/{group_id}/members/me        FR-08   settle out / leave

      POST   /groups/{group_id}/lock              needed before settlement

      POST   /groups/{group_id}/unlock

      GET    /groups/{group_id}/activity          FR-10   ?date_from&date_to (ISO instants), ?limit&offset; X-Total-Count response header

      POST   /expenses                            FR-12/13 (PRD)

      GET    /groups/{group_id}/expenses

      GET    /expenses/{trans_id}

      PATCH  /expenses/{trans_id}                 FR-15

      DELETE /expenses/{trans_id}                 FR-15   (PRD)

      GET    /groups/{group_id}/settle            FR-16/17 (PRD) preview,
      read-only (?user_id=)

      POST   /groups/{group_id}/settle            FR-17   group-wide: PERIODIC
      (default) or FINAL

      POST   /groups/{group_id}/settle/me                 INDIVIDUAL: clear my
      dues any time

      GET    /groups/{group_id}/settlement-rounds         settlement history

      GET    /groups/{group_id}/payouts           FR-21   (?user_id=)

      POST   /groups/{group_id}/payouts/{payout_id}/paid       payor: money sent

      POST   /groups/{group_id}/payouts/{payout_id}/settled    payee: money
      received

      POST   /groups/{group_id}/payouts/{payout_id}/failed     payor or payee
      (from PAID)

      POST   /groups/{group_id}/payouts/{payout_id}/cancel     payor or payee
      (from PENDING)

      POST   /groups/{group_id}/payouts/{payout_id}/remind     FR-18

      POST   /groups/{group_id}/payouts/{payout_id}/escalate   any member, PAID
      > N days

      POST   /groups/{group_id}/payouts/{payout_id}/expenses   link an ad-hoc
      payment

      POST   /groups/{group_id}/payments          FR-20   record an ad-hoc
      payment

      GET    /users/me/payouts                            to pay / to receive,
      all groups

      GET    /users/me/notifications              FR-18   (?unread_only=)

      POST   /users/me/notifications/read

      POST   /auth/refresh                          access+refresh rotation

      POST   /auth/magic-link                       202 magic-link SSO

      POST   /auth/magic-link/verify                200 auto-signin

      GET    /users/me/subscription                 plan/trial status

      POST   /subscription                          mock purchase

      POST   /groups/{group_id}/invitations         create pending invite

      GET    /groups/{group_id}/invitations

      GET    /users/me/invitations                  accept / decline

      POST   /invitations/{invitation_id}/accept    join + notify owner

      POST   /invitations/{invitation_id}/decline   notify owner

      POST   /expenses is gated by subscription_service.consume_entry -> 403
      SUBSCRIPTION_REQUIRED

      StaticFiles mounts frontend_service/ (index.html, css/, js/) at /.


      Settlement kinds: INDIVIDUAL (one user, any time) and PERIODIC (e.g. month
      end) keep the group running. FINAL needs a LOCKED group and closes it for
      good (SETTLED) once every payout has been acknowledged (SETTLED) by its
      payee and nothing is owed. Payout statuses: PENDING -> PAID (payor) ->
      SETTLED or FAILED (payee); PENDING -> SETTLED (either). Role and state
      rules are enforced by settlement_engine.
