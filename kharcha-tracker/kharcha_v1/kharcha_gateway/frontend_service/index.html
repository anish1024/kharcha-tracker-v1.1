<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Kharcha Tracker</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">Kharcha Tracker needs JavaScript enabled to run.</p>
  </noscript>

  <div id="auth-view-container"></div>

  <!-- ========================= APP SHELL ========================= -->
  <div id="app-shell" class="app-shell" hidden>

    <header class="topbar">
      <a class="brand" href="#/dashboard">
        <span class="brand-logo">&&#8377;</span><span class="brand-name">Kharcha</span>
      </a>
      <nav class="topnav" id="topnav" aria-label="Primary"></nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-bell" hidden aria-label="Notifications" title="Notifications"></button>
        <div class="user-chip">
          <span class="avatar" id="user-avatar">?</span>
          <span class="user-chip-name" id="user-chip-name"></span>
        </div>
        <button class="icon-btn" id="btn-logout" aria-label="Log out" title="Log out"></button>
      </div>

      <div class="notif-panel" id="notif-panel" hidden>
        <div class="notif-head">
          <span class="notif-title">Notifications</span>
          <button class="btn btn-ghost btn-sm" id="notif-mark-read" type="button">Mark all read</button>
        </div>
        <div class="notif-list" id="notif-list">
          <p class="empty">No notifications yet.</p>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Primary"></aside>

    <main class="main" id="main">
      <div id="view-container"></div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div id="modal-root" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
