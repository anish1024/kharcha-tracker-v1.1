  <section id="view-login" class="view view--auth" hidden>
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-logo">&&#8377;</span><span>Kharcha Tracker</span></div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to continue to your dashboard.</p>

      <form id="form-login" class="form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email"
                 placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password"
                 autocomplete="current-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
        </div>
        <p class="form-error" id="login-error" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="login-submit">Log in</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button class="btn btn-ghost btn-block" type="button" id="btn-magic-link">
        <span class="btn-icon" id="magic-icon"></span> Continue with email
      </button>
      <p class="form-hint" id="magic-hint" hidden></p>

      <p class="auth-switch">First time here? <a href="#/signup">Create an account</a></p>
    </div>
  </section>
