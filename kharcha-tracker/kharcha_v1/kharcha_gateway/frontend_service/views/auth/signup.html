  <section id="view-signup" class="view view--auth" hidden>
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-logo">&&#8377;</span><span>Kharcha Tracker</span></div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Sign up and get a one-year free trial. No card needed.</p>

      <form id="form-signup" class="form" novalidate>
        <div class="field">
          <label for="signup-name">Username</label>
          <input id="signup-name" name="name" type="text" autocomplete="username"
                 placeholder="e.g. anish" required minlength="2" maxlength="60">
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" autocomplete="email"
                 placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password"
                 autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <p class="form-error" id="signup-error" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="signup-submit">Sign up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="#/login">Log in</a></p>
    </div>
  </section>
