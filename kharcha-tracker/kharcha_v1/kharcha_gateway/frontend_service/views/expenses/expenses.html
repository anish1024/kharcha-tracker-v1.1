      <section id="view-expenses" class="view" hidden>
        <header class="view-header">
          <div>
            <h1>Expenses</h1>
            <p class="view-sub">Add and review expenses across your groups.</p>
          </div>
        </header>

        <div class="card">
          <div class="field">
            <label for="expenses-group-select">Group</label>
            <select id="expenses-group-select">
              <option value="">Select a group&hellip;</option>
            </select>
          </div>
          <p class="empty" id="expenses-empty" hidden>No groups yet &mdash; create one from the Groups screen first.</p>
          <div id="expenses-add-block" data-group-id="">
            <div class="group-expense-actions" id="expenses-add-row" hidden>
              <button class="btn btn-primary btn-sm" id="expenses-add-btn" data-action="toggle-expense" type="button">
                <span class="btn-icon" id="expenses-add-icon"></span> Add expense
              </button>
            </div>
            <div id="expenses-form-slot"></div>
          </div>
        </div>

        <div class="card" id="expenses-list-card" data-group-id="" data-expenses-for="" hidden>
          <div class="card-subtitle">Expenses</div>
          <div class="expense-list" id="expenses-list"></div>
        </div>
      </section>
