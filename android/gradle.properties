org.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvmargs="-Xmx2048m"
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.jetbrains.kotlin.incremental=true
org.jetbrains.kotlin.gradle.plugins.native.memory=fallbackToSystemConfig
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.nonFinalResAnnotations=true
android.defaults.buildfeatures.buildconfig=true
android.nonPublicResAnnotations=true
compose_compiler.enableR8ProguardProcessing=true
org.gradle.caching=true

# Compose Compiler settings
compose.enableResourcesReuse=true
android.enableR8.fullMode=true

# KSP settings
ksp.compiler.args=print=project